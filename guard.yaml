# ac-guard dogfood configuration — this repo is guarded by itself.
# Changes here are regenerated into .pre-commit-config.yaml (inside the
# AI-GUARD managed block) and .ac-guard/runtime.json via `ac-guard install`.

version: 1

project:
  name: "ac-guard"
  language: "python"

behavior:
  # read/execute — use ac-guard defaults (Track A's 11 forbidden patterns:
  #   --no-verify / SKIP= / CI= / -c core.hooksPath / git config core.hooksPath /
  #   git rebase --exec / --force / --force-with-lease / -f / +branch to main).
  write:
    # guard.yaml, .ac-guard/**, .pre-commit-config.yaml, .git/hooks/** are
    # already protected by default. The extra entries below cover repo-specific
    # policy surface that, if edited unexpectedly, would silently weaken the gate.
    require_approval:
      - pattern: "file:.importlinter"
        message: "Editing the import-linter contract changes module layering"
      - pattern: "file:scripts/**"
        message: "scripts/ contains guard infrastructure (lint checkers etc.); edits weaken enforcement"

code:
  # Schema v2 (#123): keyed by pre-commit gating stage name. Most
  # project hooks live under `pre-commit`; add `pre-push`, `commit-msg`
  # etc. as needed. `format`/`lint` toggles auto-generate per-language
  # local hooks from the `languages:` tool map.
  pre-commit:
    format: true
    lint: true      # ruff check --fix at pre-commit stage
    checks:
      forbid-noqa:
        command: "python3 scripts/check_no_noqa.py"
        types: [python]
      require-explicit-encoding:
        command: "python3 scripts/check_encoding.py"
        types: [python]

output:
  audit:
    enabled: true

languages:
  python:
    tools:
      format: "ruff format"
      lint: "ruff check --fix"
