# ac-guard dogfood configuration — this repo is guarded by itself.
# Changes here are regenerated into .pre-commit-config.yaml (inside the
# AI-GUARD managed block) and .ac-guard/runtime.json via `ac-guard install`.

version: 1

project:
  name: "ac-guard"
  language: "python"

behavior:
  # read/execute — use ac-guard defaults (Track A's 10 forbidden patterns:
  #   --no-verify / SKIP= / CI= / -c core.hooksPath / git config core.hooksPath /
  #   git rebase --exec / --force / --force-with-lease / -f / +branch).
  write:
    forbidden:
      - pattern: "file:.env*"
        reason: "Environment files contain secrets"
      - pattern: "file:**/credentials*"
        reason: "Credential files are protected"
      - pattern: "file:**/*.pem"
        reason: "Private keys must not be checked in"
    # guard.yaml, .ac-guard/**, .pre-commit-config.yaml, .git/hooks/** are
    # already protected by default. The extra entries below cover repo-specific
    # policy surface that, if edited unexpectedly, would silently weaken the gate.
    require_approval:
      - pattern: "file:.importlinter"
        message: "Editing the import-linter contract changes module layering"
      - pattern: "file:scripts/**"
        message: "scripts/ contains guard infrastructure (lint checkers etc.); edits weaken enforcement"

_pre_commit:
  minimum_version: "3.0.0"
  default_install_hook_types: [pre-commit, commit-msg, pre-push]
  default_language_version:
    python: python3

code:
  # Schema v2 (#123): keyed by pre-commit gating stage name. Most
  # project hooks live under `pre-commit`; add `pre-push`, `commit-msg`
  # etc. as needed. `format`/`lint` toggles auto-generate per-language
  # local hooks from the `languages:` tool map.
  pre-commit:
    format: true
    lint: true      # ruff check --fix at pre-commit stage
    checks:
      forbid-noqa:
        command: "python3 scripts/check_no_noqa.py"
        types: [python]
      require-explicit-encoding:
        command: "python3 scripts/check_encoding.py"
        types: [python]
    hooks:
      # Community pre-commit repos — previously block-outside of
      # .pre-commit-config.yaml, now declaratively owned by guard.yaml.
      - repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v4.6.0
        hooks:
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: end-of-file-fixer
          - id: check-yaml
            args: [--unsafe]
          - id: check-json
          - id: check-toml
          - id: detect-private-key
          - id: check-merge-conflict
          - id: check-added-large-files
            args: ["--maxkb=500"]
      - repo: https://github.com/econchick/interrogate
        rev: 1.7.0
        hooks:
          - id: interrogate
            args: ["-c", "pyproject.toml", "src/"]
            pass_filenames: false
      - repo: https://github.com/PyCQA/bandit
        rev: 1.8.0
        hooks:
          - id: bandit
            args: ["-c", "pyproject.toml", "-r", "src/"]
            additional_dependencies: ["bandit[toml]"]
            pass_filenames: false
      - repo: local
        hooks:
          - id: import-linter
            name: import-linter
            entry: lint-imports
            language: system
            pass_filenames: false
            always_run: true
            types: [python]

  commit-msg:
    hooks:
      - repo: https://github.com/compilerla/conventional-pre-commit
        rev: v3.4.0
        hooks:
          - id: conventional-pre-commit
            args: [--force-scope]

  pre-push:
    lint: true
    checks:
      pytest:
        command: "uv run --no-sync pytest --cov --cov-fail-under=80"
        pass_filenames: false
        types: [python]

output:
  locale: "zh-CN"
  audit:
    enabled: true
  pr_report:
    enabled: true

languages:
  python:
    tools:
      format: "ruff format"
      lint: "ruff check --fix"
