name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `uv sync --frozen` installs ac_guard + all dev deps into .venv.
      # The local hooks in .pre-commit-config.yaml run via `language: system`
      # and expect ruff / lint-imports / ac_guard on PATH, which `uv run`
      # provides by prepending .venv/bin.
      - run: uv sync --frozen
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Phase 1: Build + clean-venv install (#86)
      - name: Build sdist and wheel
        run: uv run python -m build
      - name: Install wheel in clean venv
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install dist/*.whl
          /tmp/e2e-venv/bin/ac-guard --version

      # Phase 2: Smoke test — full CLI journey (#83)
      - name: Smoke test — full CLI journey
        run: bash scripts/ci-e2e-smoke.sh
        env:
          AC_GUARD: /tmp/e2e-venv/bin/ac-guard

      # Phase 3: Script syntax validation (#84)
      - name: Validate generated script syntax
        run: bash scripts/ci-e2e-syntax-check.sh

      # Phase 4: Pre-commit config validation (#85)
      - name: Validate generated pre-commit config
        run: |
          /tmp/e2e-venv/bin/pip install pre-commit
          /tmp/e2e-venv/bin/pre-commit validate-config /tmp/e2e-workspace/.pre-commit-config.yaml

      # Phase 5: Cleanup (must run inside the e2e workspace, not the checkout)
      - name: Uninstall ac-guard from workspace
        run: /tmp/e2e-venv/bin/ac-guard uninstall
        working-directory: /tmp/e2e-workspace
