# Generated by ac-guard install from guard.yaml.
# DO NOT EDIT — this file is overwritten on every `ac-guard install`.
# Edit guard.yaml (code.<stage>.*) instead.
# ac-guard version: 0.1.0
minimum_pre_commit_version: "3.0.0"
default_install_hook_types: ["pre-commit", "commit-msg", "pre-push"]
default_language_version:
  python: python3

repos:
  # ---- pre-commit stage ----
  - repo: local
    hooks:
      - id: format-python
        name: "Format (python)"
        entry: "ruff format"
        language: "system"
        types: ["python"]
        pass_filenames: true
        stages: ["pre-commit"]
      - id: lint-python
        name: "Lint (python)"
        entry: "ruff check --fix"
        language: "system"
        types: ["python"]
        pass_filenames: true
        stages: ["pre-commit"]
      - id: custom-forbid-noqa
        name: "forbid-noqa"
        entry: "python3 scripts/check_no_noqa.py"
        language: "system"
        pass_filenames: true
        stages: ["pre-commit"]
        types: ["python"]
      - id: custom-require-explicit-encoding
        name: "require-explicit-encoding"
        entry: "python3 scripts/check_encoding.py"
        language: "system"
        pass_filenames: true
        stages: ["pre-commit"]
        types: ["python"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        stages: ["pre-commit"]
      - id: end-of-file-fixer
        stages: ["pre-commit"]
      - id: check-yaml
        args: ["--unsafe"]
        stages: ["pre-commit"]
      - id: check-json
        stages: ["pre-commit"]
      - id: check-toml
        stages: ["pre-commit"]
      - id: detect-private-key
        stages: ["pre-commit"]
      - id: check-merge-conflict
        stages: ["pre-commit"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
        stages: ["pre-commit"]
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: ["-c", "pyproject.toml", "src/"]
        pass_filenames: false
        stages: ["pre-commit"]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src/"]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false
        stages: ["pre-commit"]
  - repo: local
    hooks:
      - id: import-linter
        name: "import-linter"
        entry: "lint-imports"
        language: "system"
        pass_filenames: false
        always_run: true
        types: ["python"]
        stages: ["pre-commit"]
  # ---- commit-msg stage ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        args: ["--force-scope"]
        stages: ["commit-msg"]
  # ---- pre-push stage ----
  - repo: local
    hooks:
      - id: lint-python
        name: "Lint (python)"
        entry: "ruff check --fix"
        language: "system"
        types: ["python"]
        pass_filenames: true
        stages: ["pre-push"]
      - id: custom-pytest
        name: "pytest"
        entry: "uv run --no-sync pytest --cov --cov-fail-under=80"
        language: "system"
        pass_filenames: false
        stages: ["pre-push"]
        types: ["python"]
