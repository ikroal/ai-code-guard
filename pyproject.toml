[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ac-guard"
version = "0.1.0"
description = "Guardian system for AI coding agents — behavior constraints and code quality gates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ikroal", email = "ikroal@outlook.com" },
]
keywords = ["ai", "agent", "guard", "cli", "devtools", "code-quality", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.scripts]
ac-guard = "ac_guard.cli.main:app"

[project.urls]
Homepage = "https://github.com/ikroal/ai-code-guard"
Documentation = "https://github.com/ikroal/ai-code-guard#readme"
Repository = "https://github.com/ikroal/ai-code-guard"
Issues = "https://github.com/ikroal/ai-code-guard/issues"
Changelog = "https://github.com/ikroal/ai-code-guard/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "build>=1.0",
    # Pre-commit tooling — each has a matching hook in
    # .pre-commit-config.yaml, but listing here lets developers run
    # them directly from the project venv.
    "interrogate>=1.7",
    "bandit[toml]>=1.8",
    "import-linter>=2.3",
    "pre-commit>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ac_guard"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "C90",    # mccabe (complexity)
    "PLR0913", # pylint: too-many-arguments
    "PLR0915", # pylint: too-many-statements
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
    "PT",     # flake8-pytest-style
    "PIE",    # flake8-pie
    "PGH",    # pygrep-hooks
    "PERF",   # perflint (performance)
    # "FURB",  # refurb — still preview in ruff 0.15
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "FLY",    # flynt (f-string)
    "FA",     # flake8-future-annotations
    "ERA",    # eradicate (commented-out code)
    "ICN",    # flake8-import-conventions
    "LOG",    # flake8-logging
    "TC",     # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (sometimes if-else is clearer)
    "RUF022", # unsorted-dunder-all (we use comment-grouped __all__)
    "PLW0603", # global statement — used intentionally for singleton Jinja2 envs
    "RSE102", # unnecessary parens on raise — typer.Exit() requires them
    "ERA001", # commented-out code — false positives on section comments
]

[tool.ruff.lint.mccabe]
# Industry-standard McCabe ceiling (NIST / SEI / McCabe 1976). Kept
# aligned with Ruff's default; orchestrators that exceeded it were
# refactored via helper extraction rather than relaxed at the
# config layer. Per-function `# noqa: C901` is banned by the
# forbid-noqa pre-commit hook.
max-complexity = 10

[tool.ruff.lint.pylint]
# Pylint / Ruff default. Multi-knob APIs (request_json retry params,
# run_stage orchestration) are expressed through dataclass option
# bundles (RetryPolicy, StageOptions) rather than raising the limit.
# Per-line `# noqa: PLR0913` is banned.
max-args = 5
# Pylint default. Functions approaching 50 statements should be split
# into helpers — large bodies hide branching structure even when
# cyclomatic complexity stays green.
max-statements = 50

[tool.ruff.lint.isort]
known-first-party = ["ac_guard"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "ARG", "PLR0913", "C408", "TC"]  # relax requirements for tests
# Typer CLI commands map each flag to a parameter, so commands that subsume
# multiple modes (e.g. `run` covering single-check + full-stage) naturally
# exceed max-args. The dataclass-bundle pattern (RunRequest in cli.check)
# applies to the business layer; the Typer surface itself cannot use it.
"src/ac_guard/cli/main.py" = ["PLR0913"]
# Path is used at runtime in installation_path() — cannot be TYPE_CHECKING only.
"src/ac_guard/generator/models.py" = ["TC003"]

[tool.ruff.lint.pep8-naming]
# Private conventions inherited from the retired scripts/checks/_config.py:
# these module-level identifiers look like "constants" but aren't, so we
# don't want N816/N806 grumbling about them.
extend-ignore-names = ["_"]

# ---------------------------------------------------------------------------
# Docstring coverage (interrogate)
# ---------------------------------------------------------------------------
[tool.interrogate]
# 80% threshold carried over from the retired
# scripts/checks/rules/check_docstrings.py (DOCSTRING_THRESHOLD).
fail-under = 80
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-module = false
ignore-semiprivate = false
ignore-nested-functions = true
ignore-nested-classes = true
exclude = ["tests", "build", "dist", ".venv", "scripts"]
verbose = 1

# ---------------------------------------------------------------------------
# Security scanning (bandit)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv"]
# The retired scripts/checks/rules/check_security.py denied {eval, exec,
# __import__, compile} and {pickle, shelve, marshal}. Bandit's built-in
# B102/B301/B307/B322 rules cover the same ground.
#
# Skipped checks are intentional for this project:
# - B310  urllib.request.urlopen — reporters call github/gitlab APIs
# - B404  subprocess import — CLI wraps git/pytest; unavoidable
# - B603  subprocess without shell=True — the safe form, bandit's note is
#         generic and doesn't apply when inputs come from our own config
# - B607  start_process_with_partial_path — shelling to "git" by name is
#         the documented contract; hard-coding /usr/bin/git breaks users
# - B701  jinja2 autoescape=False — templates emit shell / python / yaml,
#         not HTML; autoescape would break every generated artifact
skips = ["B310", "B404", "B603", "B607", "B701"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
