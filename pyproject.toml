[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-guard"
version = "0.1.0"
description = "Guardian system for AI coding agents - behavior constraints and code quality gates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ikroal" },
]
keywords = ["ai", "agent", "guard", "cli", "devtools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.scripts]
guard = "ai_guard.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "C90",    # mccabe (complexity)
    "PLR0913", # pylint: too-many-arguments
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (sometimes if-else is clearer)
    "RUF022", # unsorted-dunder-all (we use comment-grouped __all__)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.isort]
known-first-party = ["ai_guard"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "ARG", "PLR0913", "C408"]  # relax requirements for tests

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
