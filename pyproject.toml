[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ac-guard"
version = "0.1.0"
description = "Guardian system for AI coding agents — behavior constraints and code quality gates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ikroal", email = "ikroal@outlook.com" },
]
keywords = ["ai", "agent", "guard", "cli", "devtools", "code-quality", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.scripts]
ac-guard = "ac_guard.cli.main:app"

[project.urls]
Homepage = "https://github.com/ikroal/ai-code-guard"
Documentation = "https://github.com/ikroal/ai-code-guard#readme"
Repository = "https://github.com/ikroal/ai-code-guard"
Issues = "https://github.com/ikroal/ai-code-guard/issues"
Changelog = "https://github.com/ikroal/ai-code-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "build>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ac_guard"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "C90",    # mccabe (complexity)
    "PLR0913", # pylint: too-many-arguments
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
    "PT",     # flake8-pytest-style
    "PIE",    # flake8-pie
    "PGH",    # pygrep-hooks
    "PERF",   # perflint (performance)
    # "FURB",  # refurb — still preview in ruff 0.15
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "FLY",    # flynt (f-string)
    "FA",     # flake8-future-annotations
    "ERA",    # eradicate (commented-out code)
    "ICN",    # flake8-import-conventions
    "LOG",    # flake8-logging
    "TC",     # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (sometimes if-else is clearer)
    "RUF022", # unsorted-dunder-all (we use comment-grouped __all__)
    "PLW0603", # global statement — used intentionally for singleton Jinja2 envs
    "RSE102", # unnecessary parens on raise — typer.Exit() requires them
    "ERA001", # commented-out code — false positives on section comments
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.isort]
known-first-party = ["ac_guard"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "ARG", "PLR0913", "C408", "TC"]  # relax requirements for tests

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
